---
- name: Verify the settings open what they promise
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the active TCP socket units
      ansible.builtin.command:
        argv:
          - systemctl
          - list-units
          - --state=active
          - --plain
          - --no-legend
          - libvirtd-tcp.socket
          - virtproxyd-tcp.socket
      register: _tcp_sockets
      changed_when: false

    - name: The daemon listens on TCP
      ansible.builtin.assert:
        that: _tcp_sockets.stdout_lines | length == 1

    - name: Libvirt's TCP port accepts connections
      ansible.builtin.wait_for:
        port: 16509
        timeout: 30

    - name: Read firewalld's default zone
      ansible.builtin.command:
        argv:
          - firewall-cmd
          - --get-default-zone
      register: _default_zone
      changed_when: false

    - name: Name the zone the role manages on this host
      ansible.builtin.set_fact:
        _zone_name: "{{ _default_zone.stdout if libvirt_firewall_zone is none else libvirt_firewall_zone }}"

    - name: Read the ports and services of the zone
      ansible.builtin.command:
        argv: >-
          {{ ['firewall-cmd']
          + (['--permanent'] if item.0 == 'permanent' else [])
          + ['--zone=' ~ _zone_name, '--list-' ~ item.1] }}
      loop: "{{ ['permanent', 'runtime'] | product(['ports', 'services']) | list }}"
      loop_control:
        label: "{{ item.0 }} {{ item.1 }}"
      register: _zone
      changed_when: false

    - name: The libvirt service and the migration range are open
      ansible.builtin.assert:
        that:
          - >-
            '49152-49215/tcp' in item.stdout.split()
            if item.item.1 == 'ports'
            else 'libvirt' in item.stdout.split()
        success_msg: "{{ item.item.0 }} {{ item.item.1 }}: {{ item.stdout }}"
        fail_msg: "{{ item.item.0 }} {{ item.item.1 }} are {{ item.stdout }}"
      loop: "{{ _zone.results }}"
      loop_control:
        label: "{{ item.item.0 }} {{ item.item.1 }}"

    - name: Read the ports and services of the zone the group asked for
      ansible.builtin.command:
        argv: >-
          {{ ['firewall-cmd']
          + (['--permanent'] if item.0 == 'permanent' else [])
          + ['--zone=work', '--list-' ~ item.1] }}
      loop: "{{ ['permanent', 'runtime'] | product(['ports', 'services']) | list }}"
      loop_control:
        label: "{{ item.0 }} {{ item.1 }}"
      register: _work
      changed_when: false
      when: libvirt_firewall_zone is none

    - name: A host that unset the group's zone opens nothing in it
      ansible.builtin.assert:
        that:
          - >-
            '49152-49215/tcp' not in item.stdout.split()
            if item.item.1 == 'ports'
            else 'libvirt' not in item.stdout.split()
        success_msg: "{{ item.item.0 }} {{ item.item.1 }}: {{ item.stdout }}"
        fail_msg: "{{ item.item.0 }} {{ item.item.1 }} are {{ item.stdout }}"
      loop: "{{ _work.results }}"
      loop_control:
        label: "{{ item.item.0 }} {{ item.item.1 }}"
      when: libvirt_firewall_zone is none
