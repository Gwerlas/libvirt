---
dependency:
  name: galaxy
driver:
  name: default
# Feature scenario: a representative Debian-like + RedHat-like pair is enough.
# The group asks for the `work` zone; bookworm sets `null` after it and must
# fall back to firewalld's default zone, while alma9 keeps `work`.
platforms:
  - name: bookworm
    groups:
      - debian_like
      - debian
    memory: 2
  - name: alma9
    groups:
      - redhat_like
    memory: 2
provisioner:
  name: ansible
  inventory:
    # verify.yml reads the zone without the role's defaults.
    group_vars:
      all:
        libvirt_firewall_zone: work
    host_vars:
      bookworm:
        libvirt_firewall_zone: null
  playbooks:
    create: ../shared/create.yml
    destroy: ../shared/destroy.yml
    prepare: ../shared/prepare.yml
verifier:
  name: ansible
