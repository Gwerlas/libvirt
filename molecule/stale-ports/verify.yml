---
- name: Verify an empty inventory opens nothing and only the stale range was closed
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the ports and services of the zone
      ansible.builtin.command:
        argv: >-
          {{ ['firewall-cmd']
          + (['--permanent'] if item.0 == 'permanent' else [])
          + (['--zone=' ~ libvirt_firewall_zone] if libvirt_firewall_zone is not none else [])
          + ['--list-' ~ item.1] }}
      loop: "{{ ['permanent', 'runtime'] | product(['ports', 'services']) | list }}"
      loop_control:
        label: "{{ item.0 }} {{ item.1 }}"
      register: _zone
      changed_when: false

    - name: Neither the libvirt service nor the migration range is open, the operator's port remains
      ansible.builtin.assert:
        that:
          # firewall-cmd prefixes the list with a notice when the default zone
          # holds no interface: keep the port tokens only.
          - >-
            item.stdout.split() | select('match', '^[0-9-]+/tcp$') | sort == ['8080/tcp']
            if item.item.1 == 'ports'
            else 'libvirt' not in item.stdout.split()
        success_msg: "{{ item.item.0 }} {{ item.item.1 }}: {{ item.stdout }}"
        fail_msg: "{{ item.item.0 }} {{ item.item.1 }} are {{ item.stdout }}"
      loop: "{{ _zone.results }}"
      loop_control:
        label: "{{ item.item.0 }} {{ item.item.1 }}"
