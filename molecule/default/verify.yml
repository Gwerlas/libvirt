---
- name: Verify role without any options
  hosts: all
  vars:
    cirros_version: 0.4.0
    cirros_files:
      - file: disk.img
        md5: 443b7623e27ecf03dc9e01ee93f67afe
      - file: initramfs
        md5: 89f0a4f85c5ff10b05c15b9964a174e6
      - file: kernel
        md5: ab34153f95d41544e9c35e9747cbe1de
  tasks:
    - name: Read the groups of the account Ansible connects as
      ansible.builtin.command:
        cmd: id -nG
      register: connecting_groups
      changed_when: false

    - name: Read the members of the libvirt group
      ansible.builtin.getent:
        database: group
        key: libvirt
        fail_key: false

    - name: Read the qemu:///session pools
      community.libvirt.virt_pool:
        command: list_pools
        uri: qemu:///session
      register: session_pools

    - name: An empty inventory adds the connecting account to no libvirt group
      vars:
        # The qemu group is named after the distribution (libvirt-qemu on Debian).
        libvirt_groups: [libvirt, kvm, qemu, libvirt-qemu]
      ansible.builtin.assert:
        that:
          - connecting_groups.stdout.split() | select('in', libvirt_groups) | length == 0

    - name: An empty inventory puts no account in the libvirt group
      ansible.builtin.assert:
        that:
          # The group may not exist at all (Gentoo, where nothing asked for it):
          # getent then returns null.
          - (ansible_facts.getent_group.libvirt | default(['', '', ''], true))[2] | length == 0

    - name: An empty inventory creates no qemu:///session pool
      ansible.builtin.assert:
        that:
          - "'default' not in session_pools.list_pools"

    - name: An empty inventory builds nothing with policykit on Gentoo
      when: "'gentoo' in group_names"
      ansible.builtin.command:
        argv:
          - portageq
          - has_version
          - /
          - "{{ item }}"
      loop:
        - app-emulation/libvirt[policykit]
        - sys-apps/systemd[policykit]
      register: policykit
      changed_when: false
      # has_version answers 0 for installed, 1 for not.
      failed_when: policykit.rc != 1

    - name: Local files       # noqa run-once
      delegate_to: localhost
      run_once: true
      block:
        - name: Temp dir
          ansible.builtin.tempfile:
            state: directory
          register: tmpdir

        - name: Get CirrOS files
          ansible.builtin.get_url:
            url: "https://download.cirros-cloud.net/{{ cirros_version }}/cirros-{{ cirros_version }}-x86_64-{{ item.file }}"
            checksum: "md5:{{ item.md5 }}"
            dest: "{{ tmpdir.path }}/{{ item.file }}"
            mode: 0644
          loop: "{{ cirros_files }}"

    - name: Tests
      block:
        - name: Test dir
          become: true
          ansible.builtin.file:
            path: /test
            state: directory
            owner: molecule
            group: molecule
            mode: "0755"

        - name: Push files to the host
          # copy (not synchronize) so we don't depend on rsync being present in
          # the cloud images.
          ansible.builtin.copy:
            src: "{{ tmpdir.path }}/"
            dest: /test/cirros/
            mode: "0644"

        - name: Get vars
          ansible.builtin.import_role:
            name: gwerlas.libvirt
            tasks_from: facts

        - name: Grant access to libvirt
          ansible.builtin.file:
            path: /test/cirros/
            owner: molecule
            group: molecule
            mode: "0755"
            seuser: system_u
            serole: object_r
            setype: virt_image_t
            selevel: s0

        - name: Start CirrOS
          become: true
          ansible.builtin.command:
            cmd: >
              virt-install
                --connect qemu:///system
                --name cirros
                --memory 64
                --vcpus 1
                --osinfo require=off
                --graphics none
                --network network=default
                --disk /test/cirros/disk.img
                --boot kernel=/test/cirros/kernel,initrd=/test/cirros/initramfs,kernel_args="console=/dev/ttyS0 ds=nocloud"
                --import
                --noautoconsole
          register: result
          changed_when: "'Domain creation completed.' in result.stdout"

        - name: Check that CirrOS is running
          become: true
          community.libvirt.virt:
            name: cirros
            state: running

        - name: Destroy CirrOS
          become: true
          community.libvirt.virt:
            name: cirros
            command: destroy

        - name: Undefine CirrOS
          become: true
          community.libvirt.virt:
            name: cirros
            command: undefine

      always:
        - name: Remove temp dir       # noqa run-once
          run_once: true
          delegate_to: localhost
          ansible.builtin.file:
            path: "{{ tmpdir.path }}"
            state: absent
