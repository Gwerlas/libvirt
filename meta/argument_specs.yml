---
argument_specs:
  main:
    short_description: Install and configure libvirt.
    options:
      libvirt_config:
        description: >-
          Per-file directives, as { <file>: { directive: value } }, written to
          /etc/libvirt/<file>.conf.
        type: dict
        default: {}
      libvirt_ca_file:
        description: Path on the controller to the CA certificate to deploy, none when null.
        type: str
        default: null
      libvirt_servercert:
        description: Path on the controller to the server certificate to deploy, none when null.
        type: str
        default: null
      libvirt_serverkey:
        description: Path on the controller to the server private key to deploy, none when null.
        type: str
        default: null
      libvirt_clientcert:
        description: Path on the controller to the client certificate to deploy, none when null.
        type: str
        default: null
      libvirt_clientkey:
        description: Path on the controller to the client private key to deploy, none when null.
        type: str
        default: null
      libvirt_firewall_zone:
        description: Firewalld zone to open ports in, the default zone when null.
        type: str
        default: null

  vars:
    short_description: Export roles variables.
    options:
      libvirt_backends:
        description: Virtualization technologies to support.
        type: list
        elements: str
        default: "[qemu]"

  install:
    short_description: Configure node for rootless mode.
    options:
      libvirt_backends:
        description: Virtualization technologies to support.
        type: list
        elements: str
        default: "[qemu]"
      libvirt_install:
        description: Parts of the project to install.
        type: list
        elements: str
        default: "['libvirtd', 'clients']"
      libvirt_users:
        description: List of users that can run libvirt
        type: list
        elements: dict
        default: "[]"
      libvirt_active_default_network:
        description: Active or not the default network.
        type: bool
        default: "true"
      libvirt_remove_default_network:
        description: Remove or not the default network.
        type: bool
        default: "false"

  provision:
    short_description: Configure node for rootless mode.
    options:
      libvirt_networks:
        description: List of networks to create system wide.
        type: list
        elements: dict
        default: "[]"
      libvirt_pools:
        description: List of volumes pools to create.
        type: list
        elements: dict
        default: "[]"
      libvirt_volumes:
        description: List of volumes to create.
        type: list
        elements: dict
        default: "[]"
      libvirt_domains:
        description: List of domains (virtual machines) to create.
        type: list
        elements: dict
        default: "[]"
      libvirt_default_keymap:
        description: Keyboard map to set at domains creations.
        type: str
        default: en-us
      libvirt_default_cpu:
        description: Default CPU model to use when a domain doesn't specify it. 
        type: dict
        default: "{model: 'host-model'}"
      libvirt_uri:
        description: Libvirt connection uri.
        type: str
        default: qemu:///system
