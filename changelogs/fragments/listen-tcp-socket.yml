breaking_changes:
  - >-
    ``libvirt_config.libvirtd.listen_tcp`` set to 1 now makes the daemon listen,
    as ``listen_tls`` does: the role enables the TCP socket unit. A host whose
    inventory already sets it listens on ``16509/tcp``, unencrypted, and
    libvirt's default ``auth_tcp`` is ``sasl``, so clients are refused until
    SASL is set up.
