---
- name: Load variables
  when: _libvirt_system_groups is undefined
  ansible.builtin.import_tasks: "{{ role_path }}/tasks/facts.yml"

- name: Users
  vars:
    _libvirt_group: "{{ _libvirt_system_groups.libvirt }}"
  when:
    - "'libvirtd' in libvirt_install"
    - _libvirt_group | length > 0
  become: true
  ansible.builtin.user:
    name: "{{ _libvirt_user.name }}"
    append: true
    groups:
      - "{{ _libvirt_group }}"
  loop: "{{ libvirt_users }}"
  loop_control:
    loop_var: _libvirt_user

# Each backend grants its own extra access (groups, per-user resources). Reached
# from here rather than from the backend post-install so that `-t users` covers
# it: main.yml pulls the backends through a dynamic include, which `--tags` can
# not descend into.
- name: Users - Backends
  when: "'libvirtd' in libvirt_install"
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/{{ _libvirt_backend }}/users.yml"
    apply:
      tags:
        - users
  loop: "{{ libvirt_backends }}"
  loop_control:
    loop_var: _libvirt_backend

- name: Users - Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Users - Reset connection to take effect of new groups relationship
  ansible.builtin.meta: reset_connection

- name: Users - TLS CA file
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/run-as.yml"
  loop: "{{ libvirt_users | selectattr('ca_file', 'defined') }}"
  loop_control:
    loop_var: _libvirt_user
  vars:
    _libvirt_task: tls/ca-file.yml
    _libvirt_src_file: "{{ _libvirt_user.ca_file }}"
    _libvirt_dest_file: "{{ ansible_user_dir + '/.pki/cacert.pem' }}"
    _libvirt_tls_client_side: true
  tags:
    - ca

- name: Users - TLS Client certificate
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/run-as.yml"
  loop: "{{ libvirt_users | selectattr('clientcert', 'defined') }}"
  loop_control:
    loop_var: _libvirt_user
  vars:
    _libvirt_task: tls/cert.yml
    _libvirt_src_cert: "{{ _libvirt_user.clientcert }}"
    _libvirt_dest_cert: "{{ ansible_user_dir + '/.pki/libvirt/clientcert.pem' }}"
    _libvirt_src_key: "{{ _libvirt_user.clientkey }}"
    _libvirt_dest_key: "{{ ansible_user_dir + '/.pki/libvirt/clientkey.pem' }}"
    _libvirt_tls_client_side: true
    _libvirt_cert_restart: []
  tags:
    - ssl
