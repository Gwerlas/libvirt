---
- name: Pools - Facts
  community.libvirt.virt_pool:
    command: facts
    uri: "{{ libvirt_uri }}"

- name: Pools - Create
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/pools/create.yml"
  vars:
    _libvirt_pools_to_create: |
      {{
        (
          (libvirt_pools | selectattr('state', 'undefined'))
        + (libvirt_pools | selectattr('state', 'defined') | selectattr('state', 'in', ['active', 'present']))
        ) | rejectattr('name', 'in', ansible_facts.libvirt_pools)
      }}

- name: Pools - Update facts
  community.libvirt.virt_pool:
    command: facts
    uri: "{{ libvirt_uri }}"

- name: Pools - Autostart
  community.libvirt.virt_pool:
    name: "{{ _libvirt_pool.name }}"
    autostart: "{{ _libvirt_pool.autostart }}"
    uri: "{{ libvirt_uri }}"
  loop: |
    {{
      (
        (libvirt_pools | selectattr('state', 'undefined'))
      + (libvirt_pools | selectattr('state', 'defined') | selectattr('state', 'in', ['active', 'present']))
      ) | selectattr('autostart', 'defined')
    }}
  loop_control:
    loop_var: _libvirt_pool

- name: Pools - Status
  community.libvirt.virt_pool:
    name: "{{ _libvirt_pool.name }}"
    state: "{{ _libvirt_pool.state | default('active') }}"
    uri: "{{ libvirt_uri }}"
  loop: "{{ libvirt_pools }}"
  loop_control:
    loop_var: _libvirt_pool

- name: Pools - Allow qemu to reach pools located under a user home
  when: _libvirt_runs_system_wide
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/pools/grant-traversal.yml"
  loop: "{{ libvirt_pools }}"
  loop_control:
    loop_var: _libvirt_pool
