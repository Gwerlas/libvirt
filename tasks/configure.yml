---
- name: Become root
  become: true
  block:
    - name: Configure
      when: libvirt_config is defined
      ansible.builtin.include_tasks:
        file: "{{ role_path }}/tasks/config-file.yml"
      with_dict: "{{ libvirt_config }}"
      loop_control:
        loop_var: _libvirt_config_file

    - name: TLS CA
      when: libvirt_ca_file is defined
      vars:
        _libvirt_ca_src_file: "{{ libvirt_ca_file }}"
        _libvirt_ca_dest_file: "{{ libvirt_config.libvirtd.ca_file | default('/etc/pki/CA/cacert.pem') }}"
        _libvirt_ca_restart:
          - Restart libvirt service
      ansible.builtin.include_tasks:
        file: "{{ role_path }}/tasks/tls/ca-file.yml"
      # Tagged so `-t ca` redeploys the CA (and restarts the daemon to apply it).
      tags:
        - ca

    - name: TLS Server certificate
      when: libvirt_servercert is defined
      vars:
        _libvirt_src_cert: "{{ libvirt_servercert }}"
        _libvirt_dest_cert: "{{ libvirt_config.libvirtd.cert_file | default('/etc/pki/libvirt/servercert.pem') }}"
        _libvirt_src_key: "{{ libvirt_serverkey }}"
        _libvirt_dest_key: "{{ libvirt_config.libvirtd.key_file | default('/etc/pki/libvirt/private/serverkey.pem') }}"
      ansible.builtin.include_tasks:
        file: "{{ role_path }}/tasks/tls/cert.yml"
      # Tagged so `-t ssl` redeploys the certificates (and restarts to apply).
      tags:
        - ssl

    - name: TLS Client certificate
      when: libvirt_clientcert is defined
      vars:
        _libvirt_src_cert: "{{ libvirt_clientcert }}"
        _libvirt_dest_cert: /etc/pki/libvirt/clientcert.pem
        _libvirt_src_key: "{{ libvirt_clientkey }}"
        _libvirt_dest_key: /etc/pki/libvirt/private/clientkey.pem
      ansible.builtin.include_tasks:
        file: "{{ role_path }}/tasks/tls/cert.yml"
      tags:
        - ssl

    - name: TLS socket
      when:
        - _libvirt_daemon_layout is defined
        - _libvirt_daemon_layout.tls_socket is not none
        - (libvirt_config.libvirtd.listen_tls | default(0)) | int == 1
      vars:
        _libvirt_listen_socket: "{{ _libvirt_daemon_layout.tls_socket }}"
      ansible.builtin.include_tasks:
        file: "{{ role_path }}/tasks/listen-socket.yml"

    - name: TCP socket
      when:
        - _libvirt_daemon_layout is defined
        - _libvirt_daemon_layout.tcp_socket is not none
        - (libvirt_config.libvirtd.listen_tcp | default(0)) | int == 1
      vars:
        _libvirt_listen_socket: "{{ _libvirt_daemon_layout.tcp_socket }}"
      ansible.builtin.include_tasks:
        file: "{{ role_path }}/tasks/listen-socket.yml"
