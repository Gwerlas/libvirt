---
# The qemu process runs as an unprivileged user, so it must be able to traverse
# every directory between the owner's home and the pool target, and a home
# is usually not world-traversable (~/.local and ~/.local/share are 0700), so
# the VM gets "Permission denied" opening its disk:
# https://libvirt.org/drvqemu.html#posix-users-groups
# Grant it execute-only access on those ancestors, so no directory is loosened
# for anyone else.
- name: Pools - Traversal
  vars:
    _libvirt_pool_owner: "{{ (_libvirt_pool.target.permissions | default({})).owner | default(_libvirt_system_users.qemu) }}"
    _libvirt_pool_owner_home: "{{ ansible_facts.getent_passwd[_libvirt_pool_owner][4] | default('') }}"
  when:
    - _libvirt_pool.target.path is defined
    - _libvirt_pool_owner != _libvirt_system_users.qemu
    - _libvirt_pool_owner_home | length > 0
    - _libvirt_pool.target.path.startswith(_libvirt_pool_owner_home ~ '/')
  become: true
  block:
    - name: Pools - Traversal - Ensure setfacl is available
      ansible.builtin.package:
        name: acl
        state: present

    - name: Pools - Traversal - Let qemu cross the owner home directories
      ansible.posix.acl:
        path: "{{ _libvirt_ancestor_dir }}"
        entity: "{{ _libvirt_system_users.qemu }}"
        etype: user
        permissions: x
        state: present
      loop: >-
        {%- set tp = _libvirt_pool.target.path.split('/') -%}
        {%- set hl = _libvirt_pool_owner_home.split('/') | length -%}
        {%- set ns = namespace(out=[]) -%}
        {%- for i in range(hl, tp | length) -%}
        {%- set ns.out = ns.out + [tp[:i] | join('/')] -%}
        {%- endfor -%}
        {{ ns.out }}
      loop_control:
        loop_var: _libvirt_ancestor_dir
