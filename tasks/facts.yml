---
- name: Distribution variables
  ansible.builtin.include_vars: "{{ lookup('first_found', _libvirt_vars_lookup) }}"
  vars:
    _libvirt_vars_lookup:
      files:
        - "{{ _libvirt_vars_file }}"
        - empty.yml
      paths:
        - "{{ role_path }}/vars"
  loop:
    - "{{ ansible_facts.service_mgr }}.yml"                                                     # openrc,       systemd
    - "{{ ansible_facts.os_family | lower }}-like.yml"                                          # debian-like,  redhat-like, etc.
    - "{{ ansible_facts.distribution | lower }}.yml"                                            # debian,       fedora,      ubuntu
    - "{{ ansible_facts.os_family | lower }}{{ ansible_facts.distribution_major_version }}-like.yml"  # redhat7-like
    - "{{ ansible_facts.distribution | lower }}{{ ansible_facts.distribution_major_version }}.yml"    # debian10
    - "{{ ansible_facts.distribution | lower }}-{{ ansible_facts.distribution_release | lower }}.yml" # ubuntu-bionic
  loop_control:
    loop_var: _libvirt_vars_file

- name: Backends variables
  ansible.builtin.include_vars: "{{ lookup('first_found', _libvirt_vars_lookup) }}"
  vars:
    _libvirt_vars_lookup:
      files:
        - "{{ _libvirt_vars_file }}.yml"
        - empty.yml
      paths:
        - "{{ role_path }}/vars"
  loop: "{{ libvirt_backends }}"
  loop_control:
    loop_var: _libvirt_vars_file

- name: Facts
  vars:
    _libvirt_default_users:
      kvm: kvm
      libvirt: libvirt
      qemu: qemu
    _libvirt_default_groups:
      kvm: kvm
      libvirt: libvirt
      qemu: qemu
  # Deliberately not `cacheable`: the task files guard their own load of this
  # file on these facts being undefined, so a persisted value would skip the
  # reload and serve vars derived from another distribution or backend set.
  ansible.builtin.set_fact:
    _libvirt_system_users: "{{ _libvirt_default_users | combine(_libvirt_os_users | default({})) }}"
    _libvirt_system_groups: "{{ _libvirt_default_groups | combine(_libvirt_os_groups | default({})) }}"
