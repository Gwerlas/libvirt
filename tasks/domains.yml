---
- name: Domains - Validate disk targets
  vars:
    _libvirt_domain: "{{ item.0 }}"
    _libvirt_disk: "{{ item.1 }}"
  ansible.builtin.assert:
    that:
      - _libvirt_disk.target | default('vda') is match('(vd|hd)')
    fail_msg: >-
      Disk target '{{ _libvirt_disk.target | default('vda') }}' on domain
      '{{ _libvirt_domain.name }}': only virtio (vd*) and ide (hd*) disks are supported
      for now; sata/scsi/usb (sd*) will be added later.
    quiet: true
  loop: "{{ _libvirt_domains | subelements('disks', skip_missing=true) }}"
  loop_control:
    label: "{{ _libvirt_domain.name }}: {{ _libvirt_disk.target | default('vda') }}"

- name: Domains - List VMs
  community.libvirt.virt:
    command: list_vms
    uri: "{{ libvirt_uri }}"
  register: _libvirt_vms
  check_mode: false

- name: Domains - Create domain
  community.libvirt.virt:
    command: define
    xml: "{{ lookup('template', 'domain.xml.j2') }}"
    uri: "{{ libvirt_uri }}"
  loop: |
    {{
      (
        (_libvirt_domains | selectattr('state', 'undefined'))
      + (_libvirt_domains | selectattr('state', 'defined') | selectattr('state', '!=', 'destroyed'))
      ) | rejectattr('name', 'in', _libvirt_vms.list_vms)
    }}
  loop_control:
    loop_var: _libvirt_domain

- name: Domains - Autostart
  community.libvirt.virt:
    name: "{{ _libvirt_domain.name }}"
    autostart: "{{ _libvirt_domain.autostart | default(true) }}"
    uri: "{{ libvirt_uri }}"
  loop: "{{ _libvirt_domains }}"
  loop_control:
    loop_var: _libvirt_domain

- name: Domains - State
  community.libvirt.virt:
    name: "{{ _libvirt_domain.name }}"
    state: "{{ _libvirt_domain.state | default('running') }}"
    uri: "{{ libvirt_uri }}"
  loop: "{{ _libvirt_domains }}"
  loop_control:
    loop_var: _libvirt_domain
