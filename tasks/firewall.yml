---
- name: Firewall
  become: true
  block:
    - name: Firewall - Services
      ansible.posix.firewalld:
        service: "{{ _libvirt_firewalld_service }}"
        state: enabled
        zone: "{{ libvirt_firewall_zone | default(omit) }}"
        immediate: true
        permanent: true
      # libvirt-tls (port 16514) is only opened when the daemon actually listens
      # on TLS; the plain libvirt service is always needed.
      loop: "{{ ['libvirt'] + (['libvirt-tls'] if _libvirt_listens_tls else []) }}"
      vars:
        _libvirt_listens_tls: "{{ (((libvirt_config | default({})).libvirtd | default({})).listen_tls | default(0)) | int == 1 }}"
      loop_control:
        loop_var: _libvirt_firewalld_service

    - name: Firewall - TCP ports range for domain migration
      ansible.posix.firewalld:
        port: 49152-49215/tcp
        state: enabled
        zone: "{{ libvirt_firewall_zone | default(omit) }}"
        immediate: true
        permanent: true

    # `19215-49152/tcp` is a typo shipped by 0.3.0 to 0.6.2. Remove before 1.0.0.
    # Reads and writes the zone the opening above uses.
    - name: Firewall - Stale migration ports - Read
      ansible.builtin.command:
        argv: >-
          {{ ['firewall-cmd', '--permanent']
          + (['--zone=' ~ libvirt_firewall_zone] if libvirt_firewall_zone is defined else [])
          + ['--list-ports'] }}
      register: _libvirt_permanent_ports
      changed_when: false
      check_mode: false

    - name: Firewall - Stale migration ports - Close
      ansible.posix.firewalld:
        port: 19215-49152/tcp
        state: disabled
        zone: "{{ libvirt_firewall_zone | default(omit) }}"
        permanent: true
      when: "'19215-49152/tcp' in _libvirt_permanent_ports.stdout.split()"
      notify:
        - Reload firewalld service
        - Warn about the closed migration ports

    - name: Firewall - Backend
      when: libvirt_firewall_backend is defined
      block:
        - name: Firewall - Backend - Packages
          ansible.builtin.package:
            name: "{{ libvirt_firewall_backend }}"
            state: present

        - name: Firewall - Backend - Firewalld configuration
          ansible.builtin.lineinfile:
            path: /etc/firewalld/firewalld.conf
            line: FirewallBackend={{ libvirt_firewall_backend }}
            regexp: FirewallBackend=
          notify: Restart firewalld service

- name: Firewall - Flush handlers
  ansible.builtin.meta: flush_handlers
